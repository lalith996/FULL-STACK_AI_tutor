version: '3.8'

services:
  # MongoDB
  mongodb:
    image: mongo:latest
    container_name: elearning-mongodb
    restart: unless-stopped
    environment:
      - MONGO_INITDB_DATABASE=elearning
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - elearning-network

  # Redis
  redis:
    image: redis:alpine
    container_name: elearning-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - elearning-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: elearning-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/elearning
      - REDIS_URL=redis://redis:6379
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - elearning-network

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: elearning-frontend
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://localhost:5000/api
      - VITE_SOCKET_URL=http://localhost:5000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - elearning-network

volumes:
  mongodb_data:
  redis_data:

networks:
  elearning-network:
    driver: bridge
